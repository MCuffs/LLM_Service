<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>전과정평가 보고서</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='report_styles.css') }}">
    <!-- Google Fonts: Noto Serif KR 추가 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
    <!-- Typed.js 라이브러리 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
</head>
<body>
    <div class="report-container">
        <!-- 커버 페이지 -->
        <div class="cover-page">
            <h1>전과정평가 보고서</h1>
            <p>제품명: {{ product_name }}</p>
            <p>작성일: {{ current_date }}</p>
        </div>
        <div class="report-header">
            <h2>목차</h2>
            <ul>
                <li>1. 서론</li>
                <li>2. 방법론</li>
                <li>3. 결과</li>
                <li>4. 결론</li>
                <li>5. 참고문헌</li>
            </ul>
        </div>
        <div class="report-content" id="report-content">
            <!-- 타이핑 애니메이션을 표시할 요소 -->
            <div id="typed-output"></div>
        </div>
        <div class="report-footer">
            <p>© {{ current_date[:4] }} Your Company Name. All rights reserved.</p>
        </div>
    </div>

    <!-- Typed.js 설정 -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const reportContent = `{{ report_content|safe }}`;  // Flask에서 전달된 HTML 내용

            // Typed.js는 HTML을 지원하도록 설정
            const typed = new Typed('#typed-output', {
                strings: [reportContent],
                typeSpeed: 10,       // 타이핑 속도 (밀리초)
                backSpeed: 0,        // 삭제 속도
                showCursor: true,    // 커서 표시 여부
                cursorChar: '|',
                smartBackspace: false, // 똑똑한 백스페이스 사용 여부
                // HTML을 파싱하여 올바르게 렌더링
                html: true,
                onComplete: (self) => {
                    console.log('타이핑 완료');
                }
            });
        });
    </script>
</body>
</html>
