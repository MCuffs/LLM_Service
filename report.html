<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>{{ product_name }} 전과정평가 보고서</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='report_styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
    <style>
        /* Adjustments for a smaller, more elegant cover page */
        .cover-page {
            text-align: center;
            padding: 15px;  /* Reduced padding */
            margin-bottom: 15px;
        }

        .cover-page h1 {
            font-size: 28px;  /* Reduced font size */
            font-weight: 600;
            color: #222222;
            margin-bottom: 10px;
        }

        .cover-page p {
            font-size: 16px;  /* Reduced font size */
            color: #555555;
            margin-bottom: 5px;
        }

        /* Typing animation styling */
        .typed-cursor {
            font-size: 18px;  /* Adjusted size for cursor */
            opacity: 1;
            animation: blink 0.7s infinite;  /* Blinking cursor */
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* Adjustments for a cleaner report layout */
        .report-header {
            padding-bottom: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid #dddddd;
        }

        .report-header h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333333;
        }

        .report-header ul {
            padding-left: 20px;
            list-style-type: decimal;
        }

        .report-header ul li {
            margin-bottom: 5px;
            font-size: 16px;
            color: #444444;
        }

        /* Content area where typing happens */
        .report-content {
            font-size: 16px;
            line-height: 1.6;
            color: #333333;
        }
    </style>
</head>
<body>
    <div class="report-container">
        <!-- Cover Page -->
        <div class="cover-page">
            <h1>전과정평가 보고서</h1>
            <p><strong>제품명:</strong> {{ product_name }}</p>
            <p><strong>작성일:</strong> {{ current_date }}</p>
        </div>

        <!-- Table of Contents -->
        <div class="report-header">
            <h2>목차</h2>
            <ul>
                {% for section in sections %}
                    <li>{{ loop.index }}. {{ section }}</li>
                {% endfor %}
            </ul>
        </div>

        <!-- Report Content with Typing Animation -->
        <div class="report-content" id="report-content">
            <div id="typed-output"></div> <!-- This is where the typing animation happens -->
        </div>

        <!-- Hidden Full Report Content (for typing animation to reveal) -->
        <div id="full-report" style="display: none;">
            {{ report_content|safe }}
        </div>

        <!-- Footer -->
        <div class="report-footer">
            <p>© {{ current_date[:4] }} Your Company Name. All rights reserved.</p>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const reportContent = document.getElementById('full-report').innerHTML;

            // Initialize Typed.js for the typing animation
            const typed = new Typed('#typed-output', {
                strings: [reportContent],  // The content that will be typed out
                typeSpeed: 10,  // Slower typing speed for realism
                startDelay: 10,  // Delay before starting to type
                showCursor: true,
                cursorChar: '|',  // Display the cursor
                onComplete: function() {
                    // After typing completes, replace the content with the full HTML
                    document.getElementById('report-content').innerHTML = reportContent;
                }
            });
        });
    </script>
</body>
</html>
